# Project-wide Gradle settings

# JVM memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes (recommended for build performance)
android.nonTransitiveRClass=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Configuration cache disabled — some plugins (Hilt, Google Services) may not fully support it
# org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Workaround for KSP incremental compilation cache bug
ksp.incremental=false

# Suppress AGP 8.5.x / compileSdk 35 compatibility warning
android.suppressUnsupportedCompileSdk=35

# Allow debug APKs built by Android Studio to be installed when shared
android.injected.testOnly=false
